name: Veckorapport

on:
  workflow_dispatch: {}
  schedule:
    - cron: '43 17 * * 0'

permissions:
  contents: write

concurrency:
  group: crypto-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skapa veckorapporten
        run: node bot/weekly.mjs
      - name: Lägg rapporten på grenen research-report
        run: |
          rm -rf rep && git clone -q --depth=1 --branch research-report "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rep
          cp research-out/REPORT-WEEKLY.md rep/
          cd rep
          git add REPORT-WEEKLY.md
          git -c user.name="crypto-bot" -c user.email="crypto-bot@users.noreply.github.com" commit -q -m "weekly $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Ingen ändring"
          git push -q origin research-report
