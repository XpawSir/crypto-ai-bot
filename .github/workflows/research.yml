name: Research (strategitest mot buy & hold)

# Testgren: kör bara ensemble-förbättringstestet och lägger resultatet på grenen research-funding-out
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bot/research-funding.mjs
      - name: Publicera
        run: |
          cd research-out
          git init -q -b research-funding-out
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add . && git -c user.name="crypto-bot" -c user.email="crypto-bot@users.noreply.github.com" commit -q -m "ensemble research"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin research-funding-out
