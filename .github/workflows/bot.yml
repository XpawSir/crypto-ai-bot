name: Crypto bot (paper trading)

# Varje körning loopar i ca 5,5 timmar och kör botarna var 10:e minut (bot/loop.sh),
# och startar sedan nästa körning själv. GitHubs schema nedan är bara en reserv som
# startar kedjan igen om den skulle brytas (GitHub kör det sällan i små repon).
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}       # starta för hand i Actions-fliken

permissions:
  contents: write
  actions: write              # behövs för att starta nästa körning

# Aldrig två körningar samtidigt. En väntande körning ersätts av den senaste, så det blir aldrig två kedjor.
concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Hämta sparat läge från grenen bot-state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            for f in state slow rotation ensemble; do git show FETCH_HEAD:$f.json > state/$f.json 2>/dev/null || rm -f state/$f.json; done
          else
            echo "Ingen bot-state-gren än, börjar från noll."
          fi

      - name: Kör botarna var 10:e minut i ca 5,5 timmar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bot/loop.sh

      - name: Starta nästa körning
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bot.yml --ref main -R ${{ github.repository }}
