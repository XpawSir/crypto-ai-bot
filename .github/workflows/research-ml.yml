name: Research maskininlärning

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-research-ml
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera paket
        run: pip install lightgbm pandas numpy
      - name: Kör ML-testet
        run: |
          mkdir -p research-out
          python bot/research-ml.py 2>&1 | tee research-out/ml-log.txt || { echo '# Test: maskininlärning (misslyckades)'; echo; echo '```'; tail -30 research-out/ml-log.txt; echo '```'; } > research-out/REPORT-ML.md
      - name: A lista filer
        run: |
          echo "::error::FILES: $(ls research-out | tr '\n' ' ') LOG: $(tail -c 600 research-out/ml-log.txt | tr '\n' ' ')"
          head -5 research-out/REPORT-ML.md
      - name: B klona rapportgrenen
        run: rm -rf rep && git clone -q --depth=1 --branch research-report "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rep
      - name: C kopiera och committa
        run: |
          cp research-out/REPORT-ML.md rep/
          cd rep
          git add REPORT-ML.md
          git -c user.name="crypto-bot" -c user.email="crypto-bot@users.noreply.github.com" commit -q -m "research ml" || echo "Ingen ändring"
      - name: D pusha
        run: cd rep && git push -q origin research-report
