name: Research maskininlärning

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-research-ml
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera paket
        run: pip install lightgbm pandas numpy scikit-learn
      - name: Kör ML-testet
        run: |
          set -o pipefail
          mkdir -p research-out
          python bot/research-ml.py 2>&1 | tee research-out/ml-log.txt || { echo '# Test: maskininlärning (misslyckades)'; echo; echo '```'; tail -30 research-out/ml-log.txt; echo '```'; } > research-out/REPORT-ML.md
      - name: Lägg rapporten på grenen research-report (övriga rapporter behålls)
        run: |
          rm -rf rep && git clone -q --depth=1 --branch research-report "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rep
          cp research-out/REPORT-ML.md rep/
          cd rep
          git add REPORT-ML.md
          git -c user.name="crypto-bot" -c user.email="crypto-bot@users.noreply.github.com" commit -q -m "research ml $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Ingen ändring"
          git push -q origin research-report
